<div class="details-page">

  <div class="product-details" *ngIf="product">

    <div class="image-section">
      <img [src]="product.image" [alt]="product.name">
    </div>

    <div class="info-section">
      <h1>{{ product.name }}</h1>

      <div class="rating">
        ⭐ {{ product.rating }}
      </div>

      <p class="category">
        Category: {{ product.category }}
      </p>

      <p class="description">
        {{ product.description }}
      </p>

      <h2>₹{{ product.price }}</h2>

      <button (click)="addToCart()">
        Add to Cart
      </button>

      <button class="back-btn" routerLink="/products">
        Back to Products
      </button>
    </div>

  </div>

</div>

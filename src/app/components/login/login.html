<div class="login-page">

  <div class="login-card">

    <h1>Welcome Back</h1>
    <p>Login to your ShopZone account</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required>
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p class="message" *ngIf="message">
      {{ message }}
    </p>

    <div class="signup-link">
      <span>Don't have an account?</span>

      <a routerLink="/signup">
        Create Account
      </a>
    </div>

  </div>

</div>
